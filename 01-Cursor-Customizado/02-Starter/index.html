<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02-starter. (Cursor-Customizado)</title>
  </head>
  <body>
    <div id="app">
      <section id="cursor-data" class="data-wrapper">
        <header class="data-header">
          <h1>Cursor (pointer) data:</h1>
        </header>
        
        <main class="coordinates-container">
          <aside class="axis-wrapper">
            <h2 class="data-value display-title" id="cursor-x">0</h2>
            <h6 class="data-label">x</h6>
          </aside>
          
          <aside class="axis-wrapper">
            <h2 class="data-value display-title" id="cursor-y">0</h2>
            <h6 class="data-label">y</h6>
          </aside>
        </main>
      </section>
    </div>

    <div id="cursor"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
